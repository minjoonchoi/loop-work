<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>작업 보드 · loop-work</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head><body><header><div class="topline"><div class="brand">loop-work <span>VAULT BOARD</span></div><button id="refresh" type="button">새로고침 ↻</button></div><h1>작업의 흐름을 한눈에</h1><p class="subtitle">Obsidian vault의 문서를 읽고, 필요한 결정과 재개를 처리합니다.</p><div id="source" class="source">vault 연결 중…</div></header><main><div id="warnings" role="status" aria-live="polite"></div><section class="toolbar" aria-label="작업 필터"><label for="search" class="sr-only">작업 검색</label><input id="search" type="search" placeholder="작업 이름·프로젝트 검색"><label class="toggle"><input id="actionable" type="checkbox"> 사람의 처리가 필요한 작업</label><span id="count" class="muted"></span></section><div class="workspace"><section id="board" class="board" aria-label="문서 상태별 작업 보드" aria-live="polite"><p>문서를 불러오는 중…</p></section><aside id="detail" class="detail" aria-label="선택한 작업과 문서"><div class="empty"><div class="symbol">↗</div><h2>작업을 선택하세요</h2><p>현재 기록과 중간·최종 문서, 질문과 답변을 함께 확인할 수 있습니다.</p><p class="muted">문서의 완료 표시는 현재 검증 통과를 대신하지 않습니다.</p></div></aside></div><section class="notes"><div class="section-head"><h2>내 Obsidian 노트</h2><span class="muted">사람이 작성한 메모 · 작업 권한과 분리</span></div><div id="notes"></div></section></main><div id="status" role="status" aria-live="polite"></div><footer>로컬 vault 기반 보기 · 승인과 실행은 별도 · 임의 명령 실행 없음</footer></body></html>
