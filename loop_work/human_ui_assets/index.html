<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>사람 처리함 · loop-work</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head><body><header><div class="brand">loop-work <span>LOCAL DESK</span></div><h1>사람 처리함</h1><p>필요한 결정과 승인만 모아서, 작업의 맥락과 함께 확인하세요.</p><div class="notice">답변·승인은 검증 통과나 merge를 뜻하지 않습니다. 실행은 허용된 작업 재개만 지원합니다.</div></header><main><section class="queue" aria-labelledby="queue-title"><div class="section-head"><h2 id="queue-title">요청 목록</h2><div><button id="create" type="button">새 요청</button> <button id="refresh" type="button">새로고침</button></div></div><div class="filters" role="group" aria-label="요청 필터"><button data-filter="pending" aria-pressed="true">처리 필요</button><button data-filter="history" aria-pressed="false">처리 이력</button><button data-filter="all" aria-pressed="false">전체</button></div><p id="count" class="muted"></p><div id="requests" aria-live="polite"></div></section><section id="detail" class="detail" aria-label="선택한 요청"><div class="empty"><span class="empty-mark">↗</span><h2>요청을 선택하세요</h2><p>완료 조건과 근거를 확인하고 답변을 기록할 수 있습니다.</p></div></section></main><div id="status" role="status" aria-live="polite"></div><footer>이 컴퓨터에서만 열리는 로컬 처리함 · 임의 명령 실행 없음</footer></body></html>
